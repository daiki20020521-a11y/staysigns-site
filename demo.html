<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無料デモ｜StaySigns Studio</title><style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#183942;background:#f2f8f7;margin:0}header{background:#143e48;color:#fff;padding:20px}header a{color:white}main{max-width:920px;margin:auto;padding:20px}h1{font-size:26px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fff;padding:22px;border:1px solid #d0e1de;border-radius:15px}label{display:block;font-weight:bold;font-size:14px;margin:12px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #b0c7c4;border-radius:8px;font:inherit}textarea{min-height:105px}button{background:#0c7464;color:white;padding:12px 22px;border:0;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer;margin:12px 7px 0 0}.guide{border:2px solid #116f60;padding:20px;border-radius:12px}.guide h2{color:#0e6f60;margin-top:0}.preview{line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#637d83;font-size:13px;line-height:1.7}a{color:#107664}@media(max-width:700px){.cols{grid-template-columns:1fr}}@media print{header,.editor,.noprint{display:none!important}body{background:#fff}.cols{display:block}.panel{border:0}.guide{border:1px solid #333}} 
</style></head><body><header><a href="index.html">← StaySigns Studio</a></header><main><h1>無料デモ：ゲスト案内を作る</h1><p class="muted">日本語・英語の簡易版です。入力内容はブラウザ内でのみ処理され、サーバーへ送信されません。施設固有の文章は自動翻訳しません。</p><div class="cols"><section class="panel editor"><h2>① 施設情報を入力</h2><label for="name">施設名</label><input id="name" value="Sample Stay" maxlength="80"><label for="in">チェックイン</label><input id="in" value="15:00" maxlength="40"><label for="out">チェックアウト</label><input id="out" value="10:00" maxlength="40"><label for="lang">表示言語</label><select id="lang"><option value="ja">日本語</option><option value="en">English</option></select><label for="note">施設の追加案内（翻訳されません）</label><textarea id="note" placeholder="例：夜22時以降はお静かにお過ごしください。"></textarea><button id="apply">案内を作成</button><p class="muted">実際の販売商品は5言語の定型表現や掲示POP作成に対応する予定です。</p></section><section class="panel"><h2 class="noprint">② プレビュー</h2><div class="guide"><h2 id="title"></h2><div id="preview" class="preview"></div></div><button id="print" class="noprint">印刷・PDF保存</button><p class="muted noprint">印刷時にPDF保存を選べます。スマホでは共有・プリントメニューが表示される場合があります。</p></section></div><p class="muted noprint"><a href="index.html">トップページに戻る</a>｜公開前に翻訳・施設ルールを必ず確認してください。部屋番号や鍵の暗証番号を一般公開しないでください。</p></main>
<script>
(function(){
const $=id=>document.getElementById(id);
const dict={
 ja:{checkin:"チェックイン",checkout:"チェックアウト",rules:"ご滞在中のお願い",defaultRule:"室内では禁煙です。近隣へのご配慮をお願いします。",end:"ご滞在ありがとうございます。"},
 en:{checkin:"Check-in",checkout:"Check-out",rules:"During your stay",defaultRule:"No smoking inside. Please be considerate of neighbors.",end:"Thank you for staying with us."}
};
function render(){const d=dict[$("lang").value];$("title").textContent=$("name").value.trim()||"Sample Stay";const pieces=[d.checkin+" : "+($("in").value||"-"),d.checkout+" : "+($("out").value||"-"),"",d.rules,d.defaultRule];if($("note").value.trim())pieces.push("",$("note").value.trim());pieces.push("",d.end);$("preview").textContent=pieces.join("\n");}
$("apply").addEventListener("click",render);$("lang").addEventListener("change",render);$("print").addEventListener("click",()=>window.print());render();
})();
</script></body></html>
